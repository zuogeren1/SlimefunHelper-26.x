// SlimeFunHelper+ 的根构建脚本：只负责多版本预处理节点与产物汇总。
// 各版本的公共构建逻辑在 plugin/common.gradle。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false

	// https://github.com/ReplayMod/preprocessor
	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'
}

// 版本节点：数字是预处理器的 MC 版本号，源码里可用 //#if MC >= 260200 区分。
// 26.1.2 -> 260102，26.2 -> 260200，26.3 -> 260300。
// link 是双向的，方向只决定映射表怎么用；根节点见 plugin/versions/mainProject（26.2，plugin/src 原样），
// 其它版本都由预处理器从根节点生成。
preprocess {
	strictExtraMappings = false

	def mc2612 = createNode('26.1.2', 26_01_02, '')
	def mc262 = createNode('26.2', 26_02_00, '')
	def mc263 = createNode('26.3', 26_03_00, '')

	mc2612.link(mc262, file('versions/mapping-26.1.2-26.2.txt'))
	mc262.link(mc263, file('versions/mapping-26.2-26.3.txt'))

	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

// 与宿主根 build.gradle 相同的绕行：预处理器会去解析「另一个版本」工程的 compileClasspath，
// 那个工程若不在执行图里，Gradle 会报
//   "Resolution of the configuration ':26.2:compileClasspath' was attempted without an exclusive lock"。
// 显式让 preprocessCode 依赖根节点的 compileJava，把它拉进执行图（三版本时依赖全部版本会成环）。
gradle.projectsEvaluated {
	subprojects.each { p ->
		p.tasks.matching { it.name == 'preprocessCode' }.configureEach { t ->
			subprojects.findAll { it != p && !it.tasks.names.contains('preprocessCode') }.each { other ->
				other.tasks.matching { it.name == 'compileJava' }.configureEach { ct ->
					t.dependsOn(ct)
				}
			}
		}
	}
}

// 同宿主：PreprocessTask 持有 Project 引用，标记为不兼容；含它的构建退回无配置缓存。
subprojects {
	tasks.matching { it.name.startsWith('preprocess') }.configureEach {
		notCompatibleWithConfigurationCache("preprocess plugin holds a Project reference")
	}
}

// 把各版本 build/libs 下最终的 mod jar 汇总到 plugin/build/libs。
// 规则与宿主一致：先清空再全量拷贝，所以 build/libs 的 mtime 不能用来判断新旧。
def gatherJars = tasks.register('gatherJars', Copy) {
	subprojects.each { p ->
		from(p.layout.buildDirectory.dir('libs')) {
			include '*.jar'
			exclude '*-dev.jar', '*-sources.jar', '*-thin.jar'
		}
	}
	into(layout.buildDirectory.dir('libs'))
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	doFirst { println 'Gathering SlimeFunHelper+ builds' }
}

// 宿主里 buildAndGather 靠根 build 触发；这里额外让每个版本的 build 收尾时汇总一次，
// 这样 `gradlew -p plugin :26.2:build :26.1.2:build` 也能在 plugin/build/libs 看到 jar。
gradle.projectsEvaluated {
	subprojects.each { p ->
		p.tasks.matching { it.name == 'build' }.configureEach { t ->
			t.finalizedBy(gatherJars)
			gatherJars.configure { mustRunAfter(t) }
		}
	}
}

tasks.register('buildAndGather') {
	dependsOn gatherJars
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
}

tasks.register('build') {
	dependsOn 'buildAndGather'
}

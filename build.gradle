// 注意：**不要在这个多版本工程里用 spotless / palantir-java-format** ——
// 它会在 `//` 之后插入一个空格，把 `//#if MC >= 260200` 变成 `// #if ...`、
// 把 `//$` 变成 `// $`，预处理器标记就此失效。
plugins {
	id 'maven-publish'
	// 26.1 起改用新版 Loom 插件：不 remap Minecraft 与 mod，也不再需要 mappings 声明
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'com.gradleup.shadow' version '9.6.1' apply false

	// https://github.com/ReplayMod/preprocessor
	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'
}

// 版本节点：数字是预处理器的 MC 版本号，源码里用 //#if MC >= 260200 这种标记区分版本。
// 26.1.2 -> 260102，26.2 -> 260200。
// 注意 link 的方向是「旧 -> 新」：mc2612.link(mc262) 表示 26.2 建立在 26.1.2 之上，
// 也就是 **26.2 是根节点**（源码即 src/ 原样），只有 26.1.2 需要预处理生成。
// 新增版本时在这里加节点并 link 到最近的节点即可。
preprocess {
	strictExtraMappings = false

	def mc2612 = createNode('26.1.2', 26_01_02, '')
	def mc262 = createNode('26.2', 26_02_00, '')

	// 第三个参数是「额外映射表」：把 26.1.2 的名字映射到 26.2 的名字，
	// 预处理器生成 26.1.2 源码时会自动反向套用（类改名 / 方法改名都靠它）。
	// 写法见 https://github.com/Fallen-Breath/tweakermore 的 versions/mapping-*.txt
	mc2612.link(mc262, file('versions/mapping-26.1.2-26.2.txt'))

	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

// 预处理插件会把**关联版本**（这里是根节点 26.2）工程的 compileClasspath 挂到
// preprocessCode 任务上 —— 它要读那个 classpath 来推断两个版本之间的成员映射。
// 但 26.2 是根节点，它自己没有 preprocessCode 任务，于是那个工程不会进入执行图、
// 也就不会被 Gradle 锁住；任务执行期再去解析它的配置就报：
//   "Resolution of the configuration ':26.2:compileClasspath' was attempted
//    without an exclusive lock"
// （对照：模板里每个节点都有 preprocessCode，链条一路往上，所以从不触发。）
// 这里显式让预处理任务依赖另一个版本的 compileJava，把那个工程拉进执行图。
gradle.projectsEvaluated {
	subprojects.each { p ->
		p.tasks.matching { it.name == 'preprocessCode' }.configureEach { t ->
			subprojects.findAll { it != p }.each { other ->
				other.tasks.matching { it.name == 'compileJava' }.configureEach { ct ->
					t.dependsOn(ct)
				}
			}
		}
	}
}

// 一次性构建所有版本并把 jar 汇总到根 build/libs

// preprocess 的 PreprocessTask 会持有 Project 引用，配置缓存无法序列化；
// 标记为不兼容后，含它的构建（26.1.2 编译 / 发版）自动退回无配置缓存，
// 而 :26.2:runClient 的任务图里没有它，仍然走配置缓存。
subprojects {
	tasks.matching { it.name.startsWith('preprocess') }.configureEach {
		notCompatibleWithConfigurationCache("preprocess plugin holds a Project reference")
	}
}

repositories {
	mavenCentral()
	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
}

// 便捷入口：gradlew client262 / client2612 / server262 / server2612
// 必须带工程前缀 —— 不带前缀的 `gradlew runClient` 会在**所有**含该任务的子工程里各跑一次，
// 结果是两个版本的客户端同时启动。
def targetVersions = new groovy.json.JsonSlurper().parseText(file('settings.json').text).versions
targetVersions.each { v ->
	def suffix = v.replace('.', '')
	tasks.register("client${suffix}") { dependsOn(":${v}:runClient") }
	tasks.register("server${suffix}") { dependsOn(":${v}:runServer") }
}

// 让根 `gradlew build` 也产出汇总产物：默认情况下 build 只把 jar 留在
// versions/<版本>/build/libs，根 build/libs 里可能一直躺着**上一次**的旧包（发错包的实际原因）。
tasks.register('build') {
	dependsOn 'buildAndGather'
}

def rootLibsDir = layout.buildDirectory.dir('libs').get().asFile

tasks.register('buildAndGather', Copy) {

	subprojects.each { p ->
		dependsOn p.tasks.named('build')
		from(p.layout.buildDirectory.dir('libs')) {
			include '*.jar'
			exclude '*-dev.jar', '*-sources.jar', '*-thin.jar'
		}
	}
	into rootLibsDir
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	// 先清空根 build/libs，避免版本改名后残留旧包
	outputs.upToDateWhen { false }
	doFirst {
		println 'Gathering builds'
		rootLibsDir.listFiles()?.each { it.isDirectory() ? it.deleteDir() : it.delete() }
	}
}